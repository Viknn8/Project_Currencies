server:
  port: 8080

spring:
  application:
    name: T-Bank_JavaProject
  datasource:
    url: jdbc:postgresql://localhost:5432/currency_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog.xml
    enabled: true